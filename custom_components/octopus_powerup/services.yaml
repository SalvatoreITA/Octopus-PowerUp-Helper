imposta_orario:
  name: Imposta Orario PowerUp
  description: Calcola la baseline dei 10 giorni precedenti per una specifica fascia oraria.
  fields:
    start_time:
      name: Ora di Inizio
      description: Orario di inizio (formato HH:MM:SS)
      example: "13:00:00"
      required: true
      selector:
        time:
    end_time:
      name: Ora di Fine
      description: Orario di fine (formato HH:MM:SS)
      example: "14:00:00"
      required: true
      selector:
        time:
